# Dokploy → one file per buyer, not a wildcard onto a shared container.
# SpaceBot keeps chats, channel tokens and API keys in the process data directory.
# Production is one container + one volume per buyer:
#   SPACEBOT_TENANT_ID=<userId>
#   SPACEBOT_TENANT_SECRET=<API SPACEBOT_DASHBOARD_TOKEN_SEED or AIMARKETS_SERVICE_SECRET>
# Image from .github/workflows/docker-dokploy.yml (set on the Dokploy service,
# not in this router file): ghcr.io/<github-owner>/spacebot:latest
# Copy this router for each buyer. Replace USER_ID and the service URL (port 19898).
# passHostHeader must stay on so the process can reject another buyer's token.
# `redirect-to-https` is not defined here; the Traefik instance must already provide it.

http:
  routers:
    spacebot-aimarkets-shared-http:
      rule: "Host(`spacebot.aimarkets.vn`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: spacebot-aimarkets-svc
      priority: 200

    spacebot-aimarkets-shared-https:
      rule: "Host(`spacebot.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: spacebot-aimarkets-svc
      priority: 200
      tls:
        certResolver: letsencrypt
        domains:
          - main: "spacebot.aimarkets.vn"

    spacebot-aimarkets-tenant-http:
      rule: "Host(`USER_ID.spacebot.aimarkets.vn`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: spacebot-aimarkets-svc
      priority: 50

    spacebot-aimarkets-tenant-https:
      rule: "Host(`USER_ID.spacebot.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: spacebot-aimarkets-svc
      priority: 50
      tls:
        certResolver: letsencrypt

  services:
    spacebot-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://aimarketplace-spacebot:19898"
        passHostHeader: true
